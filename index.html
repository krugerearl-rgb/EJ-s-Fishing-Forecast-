<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fishing Forecast & Catch Log</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #0ea5e9;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .species-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .species-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
        }

        .score-badge {
            background-color: #10b981;
            color: #fff;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .best-time {
            font-size: 0.85rem;
            color: #38bdf8;
            margin-bottom: 12px;
            font-weight: 500;
        }

        .tags-container {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tag {
            background-color: rgba(51, 65, 85, 0.6);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .description {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            margin-bottom: 16px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #fff;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: #334155;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 16px 0;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.9rem;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Species Card Example -->
        <div class="card">
            <div class="species-header">
                <h3 class="species-title">Dusky Kob (Cob)</h3>
                <span class="score-badge">93 / 100</span>
            </div>
            <div class="best-time">🌙 BEST TIME: 07:00 PM - 11:30 PM (Night Peak)</div>
            <div class="tags-container">
                <span class="tag">🌡️ Ideal Temp</span>
                <span class="tag">🌙 Optimal Night Feeding</span>
                <span class="tag">💨 Wind Suitable</span>
            </div>
            <div class="description">
                Weather consensus, wave limits, light/night conditions, and tide preferences align with profile thresholds.
            </div>
            <div class="btn-container">
                <button class="btn btn-primary" onclick="openLogModal()">📷 + Log Catch</button>
                <button class="btn btn-secondary">📊 View Logbook</button>
            </div>
        </div>
    </div>

    <!-- Log Your Catch Modal -->
    <div class="modal-overlay" id="logModal">
        <div class="modal">
            <h3 class="modal-title">📝 Log Your Catch</h3>
            
            <form id="catchForm" onsubmit="handleSaveCatch(event)">
                <div class="form-group">
                    <label class="form-label">Species</label>
                    <select class="form-control" id="speciesSelect">
                        <option value="Dusky Kob (Cob)">Dusky Kob (Cob)</option>
                        <option value="Shad (Elf)">Shad (Elf)</option>
                        <option value="White Steenbras">White Steenbras</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Length (cm)</label>
                        <input type="text" class="form-control" placeholder="e.g. 52 cm">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Weight (kg)</label>
                        <input type="text" class="form-control" placeholder="e.g. 1.8 kg">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Location</label>
                    <select class="form-control" id="locationDropdown" onchange="handleLocationChange(this.value)">
                        <option value="" disabled selected>Select location...</option>
                        <option value="exact">📍 Exact Location (Auto-detect GPS)</option>
                        <optgroup label="Saved Spots" id="savedSpotsGroup">
                            <option value="Richards Bay Pier">Richards Bay Pier</option>
                            <option value="Alkantstrand Beach">Alkantstrand Beach</option>
                            <option value="Pelican Island">Pelican Island</option>
                        </optgroup>
                        <option value="custom">✏️ Write custom location...</option>
                    </select>
                </div>

                <!-- Custom Location Text Input -->
                <div class="form-group hidden" id="customLocationGroup">
                    <label class="form-label">Enter Custom Location Name</label>
                    <input type="text" class="form-control" id="customLocationInput" placeholder="e.g. Oban Point Rocks">
                </div>

                <!-- Save New Location Checkbox (Appears after entering/selecting a custom location) -->
                <div class="form-group hidden" id="saveNewLocationGroup">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-main);">
                        <input type="checkbox" id="saveNewLocationCheckbox" style="accent-color: var(--accent-color); width: 16px; height: 16px;">
                        Save this as a new permanent location spot
                    </label>
                </div>

                <div class="form-group">
                    <label class="form-label">Attach Photo</label>
                    <input type="file" class="form-control" style="padding: 6px;" accept="image/*">
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn btn-primary">💾 Save Catch</button>
                    <button type="button" class="btn btn-secondary" onclick="closeLogModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openLogModal() {
            document.getElementById('logModal').classList.add('active');
        }

        function closeLogModal() {
            document.getElementById('logModal').classList.remove('active');
            resetForm();
        }

        function handleLocationChange(value) {
            const customGroup = document.getElementById('customLocationGroup');
            const saveNewGroup = document.getElementById('saveNewLocationGroup');
            const customInput = document.getElementById('customLocationInput');

            if (value === 'exact') {
                customGroup.classList.add('hidden');
                saveNewGroup.classList.add('hidden');
                customInput.value = '';
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            alert(`GPS Location Acquired: Lat ${position.coords.latitude.toFixed(4)}, Lng ${position.coords.longitude.toFixed(4)}`);
                        },
                        () => {
                            alert('Unable to retrieve your exact GPS location. Please check permissions.');
                        }
                    );
                } else {
                    alert('Geolocation is not supported by your browser.');
                }
            } else if (value === 'custom') {
                customGroup.classList.remove('hidden');
                saveNewGroup.classList.remove('hidden');
                customInput.focus();
            } else {
                // Saved spot selected
                customGroup.classList.add('hidden');
                saveNewGroup.classList.add('hidden');
                customInput.value = '';
            }
        }

        function handleSaveCatch(event) {
            event.preventDefault();
            const locationDropdown = document.getElementById('locationDropdown').value;
            const customInput = document.getElementById('customLocationInput').value;
            const shouldSaveNew = document.getElementById('saveNewLocationCheckbox').checked;

            if (locationDropdown === 'custom' && shouldSaveNew && customInput.trim() !== '') {
                // Dynamically add to saved spots group for session persistence
                const savedGroup = document.getElementById('savedSpotsGroup');
                const newOption = document.createElement('option');
                newOption.value = customInput.trim();
                newOption.text = customInput.trim();
                savedGroup.appendChild(newOption);
                alert(`New location "${customInput.trim()}" saved successfully!`);
            }

            alert('Catch logged successfully!');
            closeLogModal();
        }

        function resetForm() {
            document.getElementById('catchForm').reset();
            document.getElementById('customLocationGroup').classList.add('hidden');
            document.getElementById('saveNewLocationGroup').classList.add('hidden');
        }

        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('logModal');
            if (event.target === modal) {
                closeLogModal();
            }
        }
    </script>
</body>
</html>
